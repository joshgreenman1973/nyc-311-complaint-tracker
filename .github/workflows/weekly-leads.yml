name: Weekly leads build

on:
  schedule:
    - cron: '30 12 * * 1'    # Mondays 12:30 UTC (8:30am ET), before the Open Data scan
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: weekly-leads
  cancel-in-progress: false

jobs:
  leads:
    runs-on: ubuntu-latest
    # 150, not 90: Socrata read stalls push runs to ~85 min (Aug 31), and the
    # Aug 24 run was cancelled at 90 while still retrying.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r data/requirements.txt

      - name: Build leads
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: python data/leads/build_leads.py

      - name: Commit
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/output/
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly leads $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git pull --rebase
            git push
          fi
